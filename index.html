<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAYAMI DRIFT: ULTIMATE EDITION</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; }
    </style>
</head>
<body>
<script>
class GameEngine extends Phaser.Scene {
    constructor() { super('GameEngine'); }

    preload() {
        this.load.image('player', 'assets/player.png');
        this.load.image('enemy', 'assets/enemy.png');
        this.load.image('road', 'assets/road.png');
        this.load.audio('music', 'assets/music.mp3');
    }

    create() {
        this.cameras.main.setBackgroundColor('#000000');
        
        // 1. БЕКГРАУНД С ПАРАЛЛАКСОМ
        this.road = this.add.tileSprite(0, 0, window.innerWidth, window.innerHeight, 'road').setOrigin(0);
        
        // 2. ИГРОК С ФИЗИКОЙ
        this.player = this.physics.add.sprite(window.innerWidth / 2, window.innerHeight - 150, 'player');
        this.player.setDepth(10).setCollideWorldBounds(true);
        
        // 3. СИСТЕМА ЧАСТИЦ (ЭФФЕКТ ДРИФТА)
        this.particles = this.add.particles(0, 0, 'player', {
            speed: 50, scale: { start: 0.5, end: 0 }, blendMode: 'ADD', frequency: 50
        });
        this.particles.startFollow(this.player);

        // 4. ГРУППА ВРАГОВ
        this.traffic = this.physics.add.group();

        // 5. ЗВУКОВОЙ МЕНЕДЖЕР
        this.bgMusic = this.sound.add('music', { loop: true, volume: 0.4 });
        this.input.once('pointerdown', () => this.bgMusic.play());

        // 6. УПРАВЛЕНИЕ (TOUCH + MOUSE)
        this.input.on('pointermove', (p) => {
            this.tweens.add({ targets: this.player, x: p.x, duration: 100, ease: 'Power2' });
        });

        // 7. СЧЕТ И UI
        this.score = 0;
        this.speed = 10;
        this.scoreText = this.add.text(20, 20, 'KILLS: 0', { 
            fontSize: '32px', fill: '#FF00FF', fontFamily: 'Courier' 
        }).setDepth(100);

        // 8. СЛОЖНАЯ ЛОГИКА СПАВНА
        this.spawnTimer = this.time.addEvent({ 
            delay: 700, callback: this.spawnTraffic, callbackScope: this, loop: true 
        });
    }

    spawnTraffic() {
        let x = Phaser.Math.Between(50, window.innerWidth - 50);
        let enemy = this.traffic.create(x, -100, 'enemy');
        enemy.setVelocityY(600 + (this.score * 5));
        enemy.setDepth(5);
        this.score++;
        this.speed += 0.5;
        this.scoreText.setText('KILLS: ' + this.score);
    }

    update() {
        this.road.tilePositionY -= this.speed;

        this.traffic.children.iterate((child) => {
            if (child && child.y > window.innerHeight + 100) child.destroy();
        });

        this.physics.overlap(this.player, this.traffic, () => {
            this.bgMusic.stop();
            this.scene.restart();
            this.score = 0;
            this.speed = 10;
        }, null, this);
    }
}

const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { 
        default: 'arcade', 
        arcade: { gravity: { y: 0 }, debug: false } 
    },
    scene: GameEngine,
    fps: { target: 60, forceSetTimeOut: true }
};

new Phaser.Game(config);
</script>
</body>
</html>
