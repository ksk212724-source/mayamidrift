<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #logo-container { text-align: center; padding: 20px 0; }
        #logo { width: 120px; }
        #chatBox { flex: 1; padding: 20px; overflow-y: auto; }
        .message { background: #1a1a1a; padding: 12px 18px; border-radius: 18px; margin-bottom: 10px; max-width: 85%; }
        .user { align-self: flex-end; background: #2b2b2b; text-align: right; margin-left: auto; }
        .typing { font-style: italic; color: #888; margin-bottom: 10px; }
        .input-area { padding: 15px; background: #000; display: flex; gap: 10px; border-top: 1px solid #222; }
        input { flex: 1; background: #1a1a1a; border: none; color: #fff; padding: 15px; border-radius: 20px; outline: none; }
        button { background: #fff; color: #000; border: none; padding: 0 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <audio id="bgMusic" src="music.mp3" loop></audio>
    <div id="logo-container"><img src="logo.png" id="logo" alt="MAYAMI"></div>
    
    <div id="chatBox"></div>
    
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask MAYAMI AI...">
        <button onclick="askAI()">➤</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Музыка играет по клику
        document.body.addEventListener('click', () => {
            document.getElementById('bgMusic').play().catch(()=>{});
        }, { once: true });

        async function askAI() {
            const input = document.getElementById('userInput');
            const box = document.getElementById('chatBox');
            if (!input.value) return;

            box.innerHTML += `<div class="message user">${input.value}</div>`;
            const userText = input.value;
            input.value = '';

            const typing = document.createElement('div');
            typing.className = 'typing';
            typing.innerText = "MAYAMI AI печатает...";
            box.appendChild(typing);
            box.scrollTop = box.scrollHeight;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Authorization": "Bearer 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", 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        messages: [{role: "user", content: userText}]
                    })
                });
                const data = await response.json();
                typing.remove();
                box.innerHTML += `<div class="message">${data.choices[0].message.content}</div>`;
            } catch (e) {
                typing.innerText = "Ошибка сети, Босс.";
            }
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
