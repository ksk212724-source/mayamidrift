<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAYAMI AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; margin: 0; padding: 20px; height: 100vh; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        .logo-wrapper { margin: 40px 0; width: 60%; }
        #logo { width: 100%; height: auto; }
        #responseArea { flex: 1; width: 90%; color: #d1d8e0; font-size: 16px; text-align: center; overflow-y: auto; }
        .input-container { width: 90%; margin-bottom: 20px; }
        #userInput { width: 100%; padding: 15px; border-radius: 20px; border: 1px solid #333; background: #111; color: #fff; box-sizing: border-box; }
    </style>
</head>
<body>
    <audio src="music.mp3" loop autoplay></audio>
    <div class="logo-wrapper"><img src="logo.png" id="logo"></div>
    <div id="responseArea">Напиши запрос Боссу...</div>
    <div class="input-container">
        <input type="text" id="userInput" placeholder="Твой запрос...">
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Настройка главной кнопки (она появится внизу Telegram)
        tg.MainButton.setText("ОТПРАВИТЬ БОССУ");
        tg.MainButton.show();
        
        tg.onEvent('mainButtonClicked', function(){
            const text = document.getElementById('userInput').value;
            if(text) {
                tg.sendData(JSON.stringify({text: text}));
                document.getElementById('responseArea').innerText = "Обработка...";
            }
        });
    </script>
</body>
</html>
