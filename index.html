<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAYAMI AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background-color: #ffffff; /* Чистый белый фон */
            color: #000000; 
            margin: 0; 
            padding: 20px; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-family: sans-serif; 
        }
        
        .logo-wrapper { margin: 40px 0; width: 60%; }
        #logo { width: 100%; height: auto; }

        /* Поле ввода и старая добрая кнопка */
        .container { width: 100%; display: flex; flex-direction: column; gap: 15px; }
        #userInput { 
            width: 100%; padding: 15px; border-radius: 15px; 
            border: 1px solid #ccc; background: #f9f9f9; color: #000; 
            box-sizing: border-box; font-size: 16px; 
        }
        #sendBtn { 
            width: 100%; padding: 15px; border-radius: 15px; 
            border: none; background: #000; color: #fff; 
            font-weight: bold; font-size: 16px; cursor: pointer; 
        }
    </style>
</head>
<body>

    <audio src="music.mp3" loop autoplay></audio>

    <div class="logo-wrapper"><img src="logo.png" id="logo"></div>

    <div class="container">
        <input type="text" id="userInput" placeholder="Напиши запрос Боссу...">
        <button id="sendBtn" onclick="sendMessage()">ОТПРАВИТЬ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function sendMessage() {
            const input = document.getElementById('userInput');
            if (input.value.trim() !== "") {
                // Отправка данных в бота
                tg.sendData(JSON.stringify({text: input.value}));
                input.value = '';
            }
        }
    </script>
</body>
</html>
