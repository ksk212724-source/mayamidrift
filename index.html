<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Rush</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #gameWrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 480px;
    margin: 0 auto;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 16px 20px;
    pointer-events: none;
    z-index: 10;
  }
  #scoreDisplay {
    color: #fff;
    font-size: clamp(18px, 5vw, 26px);
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
    font-family: 'Courier New', monospace;
  }
  #livesDisplay {
    position: absolute;
    top: 16px; right: 20px;
    display: flex; gap: 6px;
  }
  .heart {
    font-size: clamp(16px, 4vw, 22px);
    filter: drop-shadow(0 0 6px #f0f);
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,10,0.85);
    z-index: 20;
    gap: 20px;
  }
  #overlay.hidden { display: none; }
  #overlayTitle {
    font-size: clamp(28px, 8vw, 48px);
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #0ff;
    text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
    font-family: 'Courier New', monospace;
    text-align: center;
  }
  #overlayScore {
    font-size: clamp(16px, 4vw, 22px);
    color: #f0f;
    text-shadow: 0 0 10px #f0f;
    letter-spacing: 2px;
  }
  #overlayBtn {
    margin-top: 10px;
    padding: 14px 40px;
    background: transparent;
    border: 2px solid #0ff;
    color: #0ff;
    font-size: clamp(16px, 4vw, 20px);
    font-family: 'Courier New', monospace;
    letter-spacing: 3px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 0 20px #0ff, inset 0 0 20px rgba(0,255,255,0.1);
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  #overlayBtn:active {
    background: rgba(0,255,255,0.2);
    transform: scale(0.97);
  }
  #bestScore {
    font-size: clamp(13px, 3vw, 16px);
    color: #aaa;
    letter-spacing: 1px;
  }
  #controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 100%;
    display: flex;
    pointer-events: none;
    z-index: 5;
  }
  #ctrlLeft, #ctrlRight {
    flex: 1;
    height: 100%;
    pointer-events: all;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="c"></canvas>

  <div id="ui">
    <div id="scoreDisplay">SCORE: 0</div>
    <div id="livesDisplay">
      <span class="heart">❤</span>
      <span class="heart">❤</span>
      <span class="heart">❤</span>
    </div>
  </div>

  <div id="controls">
    <div id="ctrlLeft"></div>
    <div id="ctrlRight"></div>
  </div>

  <div id="overlay">
    <div id="overlayTitle">NEON RUSH</div>
    <div id="overlayScore" style="display:none"></div>
    <div id="bestScore"></div>
    <button id="overlayBtn">СТАРТ</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('gameWrapper');

// Telegram init
if (window.Telegram?.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

// Assets
const assets = {};
const toLoad = { road: 'road.png', player: 'player.png', enemy: 'enemy.png' };
let loadedCount = 0;
const totalAssets = Object.keys(toLoad).length;

function loadAssets(cb) {
  for (const [key, src] of Object.entries(toLoad)) {
    const img = new Image();
    img.onload = () => { loadedCount++; if (loadedCount === totalAssets) cb(); };
    img.onerror = () => { loadedCount++; if (loadedCount === totalAssets) cb(); };
    img.src = src;
    assets[key] = img;
  }
}

// Music
let music = null;
function initMusic() {
  if (!music) {
    music = new Audio('music.mp3');
    music.loop = true;
    music.volume = 0.4;
  }
  music.play().catch(() => {});
}
function stopMusic() { if (music) { music.pause(); music.currentTime = 0; } }

// Game state
let W, H, DPR;
let game = null;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = wrapper.clientWidth;
  H = wrapper.clientHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.scale(DPR, DPR);
  if (game) game.resize(W, H);
}

window.addEventListener('resize', resize);
resize();

// ── Game class ──────────────────────────────────────────────────────────────
class Game {
  constructor(w, h) {
    this.w = w; this.h = h;
    this.reset();
  }

  resize(w, h) { this.w = w; this.h = h; }

  reset() {
    const w = this.w, h = this.h;

    // Road
    this.roadY = 0;
    this.roadSpeed = h * 0.008;

    // Lanes
    this.laneCount = 3;
    this.roadLeft  = w * 0.05;
    this.roadRight = w * 0.95;
    this.roadW = this.roadRight - this.roadLeft;
    this.laneW = this.roadW / this.laneCount;

    // Player
    this.playerLane = 1;
    this.playerW = w * 0.15;
    this.playerH = this.playerW * 1.8;
    this.playerX = this.laneCenter(1) - this.playerW / 2;
    this.playerTargetX = this.playerX;
    this.playerY = h * 0.65;

    // Enemies
    this.enemies = [];
    this.enemyTimer = 0;
    this.enemyInterval = 120; // frames

    // Score / lives
    this.score = 0;
    this.lives = 3;
    this.scoreTimer = 0;
    this.dead = false;
    this.invincible = 0;

    // Speed scaling
    this.speedMult = 1;
    this.frame = 0;

    // Hit flash
    this.flash = 0;

    // Neon side pillars scroll
    this.pillarsY = 0;
  }

  laneCenter(i) {
    return this.roadLeft + i * this.laneW + this.laneW / 2;
  }

  moveLeft()  { if (this.playerLane > 0) { this.playerLane--; this.playerTargetX = this.laneCenter(this.playerLane) - this.playerW / 2; } }
  moveRight() { if (this.playerLane < this.laneCount - 1) { this.playerLane++; this.playerTargetX = this.laneCenter(this.playerLane) - this.playerW / 2; } }

  spawnEnemy() {
    const lane = Math.floor(Math.random() * this.laneCount);
    const ew = this.playerW * 1.1;
    const eh = ew * 1.6;
    this.enemies.push({
      lane,
      x: this.laneCenter(lane) - ew / 2,
      y: -eh,
      w: ew,
      h: eh,
      speed: this.h * 0.008 * this.speedMult + this.h * 0.002
    });
  }

  update() {
    if (this.dead) return;
    this.frame++;

    // Speed up over time
    this.speedMult = 1 + this.frame / 2000;
    this.roadSpeed = this.h * 0.008 * this.speedMult;

    // Road scroll
    this.roadY = (this.roadY + this.roadSpeed * 2) % (this.h * 0.12);
    this.pillarsY = (this.pillarsY + this.roadSpeed * 2) % 80;

    // Player slide
    this.playerX += (this.playerTargetX - this.playerX) * 0.18;

    // Score
    this.scoreTimer++;
    if (this.scoreTimer >= 6) { this.score += 10; this.scoreTimer = 0; }

    // Enemy spawn
    this.enemyTimer++;
    const interval = Math.max(50, this.enemyInterval / this.speedMult);
    if (this.enemyTimer >= interval) {
      this.spawnEnemy();
      this.enemyTimer = 0;
    }

    // Enemy update
    this.enemies.forEach(e => { e.y += e.speed; });
    this.enemies = this.enemies.filter(e => e.y < this.h + e.h);

    // Collision
    if (this.invincible > 0) { this.invincible--; } else {
      for (const e of this.enemies) {
        if (this.rectsOverlap(
          this.playerX + this.playerW * 0.1, this.playerY + this.playerH * 0.1,
          this.playerW * 0.8, this.playerH * 0.8,
          e.x + e.w * 0.1, e.y + e.h * 0.1, e.w * 0.8, e.h * 0.8
        )) {
          this.lives--;
          this.flash = 20;
          this.invincible = 90;
          if (this.lives <= 0) { this.dead = true; stopMusic(); }
          break;
        }
      }
    }

    if (this.flash > 0) this.flash--;
  }

  rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  draw() {
    const { w, h } = this;
    ctx.clearRect(0, 0, w, h);

    // Background
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, w, h);

    // Draw road
    this.drawRoad();

    // Neon pillars
    this.drawPillars();

    // Dashes
    this.drawDashes();

    // Enemies
    this.enemies.forEach(e => this.drawEnemy(e));

    // Player (flicker if invincible)
    if (this.invincible === 0 || Math.floor(this.invincible / 6) % 2 === 0) {
      this.drawPlayer();
    }

    // Flash overlay
    if (this.flash > 0) {
      ctx.fillStyle = `rgba(255,0,80,${this.flash / 30})`;
      ctx.fillRect(0, 0, w, h);
    }
  }

  drawRoad() {
    const { w, h } = this;
    // Road surface
    if (assets.road && assets.road.complete && assets.road.naturalWidth) {
      const pat = ctx.createPattern(assets.road, 'repeat');
      if (pat) {
        ctx.save();
        ctx.translate(0, this.roadY - this.h * 0.12);
        ctx.fillStyle = pat;
        ctx.fillRect(this.roadLeft, 0, this.roadW, h + this.h * 0.12);
        ctx.restore();
      } else {
        this.drawRoadFallback();
      }
    } else {
      this.drawRoadFallback();
    }
  }

  drawRoadFallback() {
    const { w, h } = this;
    const grad = ctx.createLinearGradient(this.roadLeft, 0, this.roadRight, 0);
    grad.addColorStop(0, '#0d0d1a');
    grad.addColorStop(0.5, '#131326');
    grad.addColorStop(1, '#0d0d1a');
    ctx.fillStyle = grad;
    ctx.fillRect(this.roadLeft, 0, this.roadW, h);
  }

  drawDashes() {
    const { h } = this;
    ctx.strokeStyle = '#00eeff';
    ctx.lineWidth = 2;
    ctx.setLineDash([h * 0.06, h * 0.06]);
    ctx.lineDashOffset = -this.roadY;

    for (let i = 1; i < this.laneCount; i++) {
      const x = this.roadLeft + i * this.laneW;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  drawPillars() {
    const { w, h } = this;
    const pillarW = w * 0.06;
    const segH = 80;
    const colors = ['#ff00ff', '#0080ff', '#ff00ff'];

    // Left pillar
    for (let y = -segH + this.pillarsY; y < h + segH; y += segH) {
      const ci = Math.floor(y / segH) % colors.length;
      const col = colors[Math.abs(ci) % colors.length];
      ctx.fillStyle = col;
      ctx.shadowColor = col;
      ctx.shadowBlur = 18;
      ctx.fillRect(0, y, pillarW, segH - 4);
    }

    // Right pillar
    for (let y = -segH + this.pillarsY; y < h + segH; y += segH) {
      const ci = Math.floor(y / segH) % colors.length;
      const col = colors[Math.abs(ci) % colors.length];
      ctx.fillStyle = col;
      ctx.shadowColor = col;
      ctx.shadowBlur = 18;
      ctx.fillRect(w - pillarW, y, pillarW, segH - 4);
    }
    ctx.shadowBlur = 0;
  }

  drawPlayer() {
    const { playerX: x, playerY: y, playerW: pw, playerH: ph } = this;
    if (assets.player && assets.player.complete && assets.player.naturalWidth) {
      ctx.save();
      // Glow
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 30;
      ctx.drawImage(assets.player, x, y, pw, ph);
      ctx.restore();
    } else {
      // Fallback player
      ctx.save();
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 25;
      ctx.fillStyle = '#00eeff';
      ctx.beginPath();
      ctx.roundRect(x, y, pw, ph, 8);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // Headlight beams
    ctx.save();
    const grd = ctx.createRadialGradient(x + pw / 2, y, 4, x + pw / 2, y - ph * 0.4, ph * 0.6);
    grd.addColorStop(0, 'rgba(200,240,255,0.5)');
    grd.addColorStop(1, 'rgba(200,240,255,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(x + pw / 2, y, pw * 0.5, ph * 0.5, 0, Math.PI, 2 * Math.PI);
    ctx.fill();
    ctx.restore();
  }

  drawEnemy(e) {
    if (assets.enemy && assets.enemy.complete && assets.enemy.naturalWidth) {
      ctx.save();
      ctx.shadowColor = '#ff8800';
      ctx.shadowBlur = 20;
      ctx.drawImage(assets.enemy, e.x, e.y, e.w, e.h);
      ctx.restore();
    } else {
      ctx.save();
      ctx.shadowColor = '#ff6600';
      ctx.shadowBlur = 20;
      ctx.fillStyle = '#555577';
      ctx.beginPath();
      ctx.roundRect(e.x, e.y, e.w, e.h, 6);
      ctx.fill();
      // Truck details
      ctx.fillStyle = '#ff00aa';
      ctx.fillRect(e.x + e.w * 0.1, e.y + e.h * 0.05, e.w * 0.8, e.h * 0.2);
      ctx.fillStyle = '#ff8800';
      ctx.fillRect(e.x + e.w * 0.1, e.y + e.h * 0.78, e.w * 0.35, e.h * 0.12);
      ctx.fillRect(e.x + e.w * 0.55, e.y + e.h * 0.78, e.w * 0.35, e.h * 0.12);
      ctx.restore();
    }
  }
}

// ── Main loop ────────────────────────────────────────────────────────────────
let running = false;
let animId = null;
let bestScore = +localStorage.getItem('neonrush_best') || 0;

const overlay    = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayScore = document.getElementById('overlayScore');
const overlayBtn = document.getElementById('overlayBtn');
const scoreDisp  = document.getElementById('scoreDisplay');
const livesDisp  = document.getElementById('livesDisplay');
const bestScoreEl= document.getElementById('bestScore');

function updateLivesUI(n) {
  livesDisp.innerHTML = '';
  for (let i = 0; i < Math.max(0, n); i++) {
    livesDisp.innerHTML += '<span class="heart">❤</span>';
  }
}

function startGame() {
  overlay.classList.add('hidden');
  game = new Game(W, H);
  running = true;
  initMusic();
  loop();
}

function loop() {
  if (!running) return;
  game.resize(W, H);
  game.update();
  game.draw();

  // HUD
  scoreDisp.textContent = 'SCORE: ' + game.score;
  updateLivesUI(game.lives);

  if (game.dead) {
    running = false;
    if (game.score > bestScore) {
      bestScore = game.score;
      localStorage.setItem('neonrush_best', bestScore);
    }
    showGameOver();
    return;
  }
  animId = requestAnimationFrame(loop);
}

function showGameOver() {
  overlayTitle.textContent = 'GAME OVER';
  overlayScore.style.display = 'block';
  overlayScore.textContent = 'СЧЁТ: ' + (game ? game.score : 0);
  bestScoreEl.textContent = 'РЕКОРД: ' + bestScore;
  overlayBtn.textContent = 'СНОВА';
  overlay.classList.remove('hidden');
}

overlayBtn.addEventListener('click', () => {
  if (animId) cancelAnimationFrame(animId);
  startGame();
});

// ── Touch controls ───────────────────────────────────────────────────────────
let touchStartX = null;

canvas.addEventListener('touchstart', e => {
  if (!running || !game) return;
  touchStartX = e.touches[0].clientX;
}, { passive: true });

canvas.addEventListener('touchend', e => {
  if (!running || !game || touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 20) {
    dx < 0 ? game.moveLeft() : game.moveRight();
  }
  touchStartX = null;
}, { passive: true });

// Tap zones (left half = left, right half = right)
document.getElementById('ctrlLeft').addEventListener('click', () => { if (game && running) game.moveLeft(); });
document.getElementById('ctrlRight').addEventListener('click', () => { if (game && running) game.moveRight(); });

// Keyboard
document.addEventListener('keydown', e => {
  if (!game || !running) return;
  if (e.key === 'ArrowLeft' || e.key === 'a') game.moveLeft();
  if (e.key === 'ArrowRight' || e.key === 'd') game.moveRight();
});

// ── Init ─────────────────────────────────────────────────────────────────────
bestScoreEl.textContent = bestScore ? 'РЕКОРД: ' + bestScore : '';
overlayScore.style.display = 'none';

loadAssets(() => {
  // Draw initial frame
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);
});
</script>
</body>
</html>
