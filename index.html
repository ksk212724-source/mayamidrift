<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MayamiDrift</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#07080c;--acc:#f5a623;--red:#e63946;--blue:#4cc9f0;--green:#57cc99;--dim:#555;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;position:fixed;top:0;left:0;}
body{display:flex;justify-content:center;align-items:center;font-family:'Arial',sans-serif;}
#wrap{position:relative;width:100vw;height:100vh;max-width:430px;overflow:hidden;background:var(--bg);}
canvas{display:block;width:100%;height:100%;}
#hud{position:absolute;top:0;left:0;right:0;padding:8px 12px;pointer-events:none;z-index:10;display:flex;justify-content:space-between;background:rgba(0,0,0,.3);}
#scoreLbl{font-size:24px;color:#fff;font-weight:bold;}
#bestLbl{font-size:9px;color:var(--dim);margin-top:2px;}
#rightHud{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
#livesRow{display:flex;gap:4px;}
.hrt{width:14px;height:14px;}
#ctrlArea{position:absolute;bottom:0;left:0;right:0;height:100px;display:flex;z-index:20;}
#ctrlL,#ctrlR{flex:1;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:none;cursor:pointer;}
#ctrlL{border-right:1px solid rgba(255,255,255,.06);}
#ctrlL::after{content:"◀";}#ctrlR::after{content:"▶";}
#ctrlL::after,#ctrlR::after{font-size:32px;color:rgba(255,255,255,.2);}
#ctrlL:active::after,#ctrlR:active::after{color:var(--acc);text-shadow:0 0 16px var(--acc);}
#pauseBtn{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:6px 12px;cursor:pointer;font-size:12px;border-radius:4px;z-index:21;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;overflow-y:auto;background:var(--bg);}
.screen.hidden{display:none!important;}
.mm-logo{font-size:48px;color:#fff;font-weight:bold;margin-bottom:12px;text-align:center;}
.mm-logo span{color:var(--acc);text-shadow:0 0 20px rgba(245,166,35,.6);}
.mm-nav{display:flex;flex-direction:column;gap:8px;width:100%;max-width:240px;padding:0 16px;}
.mm-btn{padding:12px;background:var(--acc);border:none;color:#000;font-size:16px;font-weight:bold;cursor:pointer;border-radius:6px;width:100%;}
.mm-btn:active{transform:scale(.95);}
.mm-btn.sec{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;font-size:14px;}
#coinRow{display:flex;align-items:center;gap:6px;margin-bottom:12px;font-size:14px;}
.coin-ico{width:14px;height:14px;background:radial-gradient(circle,#ffe566,#f5a623);border-radius:50%;}
.car-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:320px;max-height:50vh;overflow-y:auto;}
.car-cell{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
.car-cell.selected{border-color:var(--acc);background:rgba(245,166,35,.1);}
.car-cell canvas{width:32px;height:50px;}
.car-name{font-size:8px;color:rgba(255,255,255,.6);}
#leaderList{width:100%;max-width:300px;max-height:45vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.lrow{display:flex;align-items:center;gap:8px;padding:8px;background:rgba(255,255,255,.04);border-radius:6px;}
.lrow.me{background:rgba(245,166,35,.1);}
.lrank{width:20px;font-weight:bold;color:var(--dim);}
.lname{flex:1;font-size:12px;color:#fff;}
.lscore{font-size:14px;color:var(--acc);font-weight:bold;}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<button id="pauseBtn">⏸ PAUSE</button>
<div id="hud">
  <div><div id="scoreLbl">0</div><div id="bestLbl">BEST: 0</div></div>
  <div id="rightHud"><div id="livesRow"></div></div>
</div>
<div id="ctrlArea"><button id="ctrlL"></button><button id="ctrlR"></button></div>

<div id="mainMenu" class="screen">
  <div class="mm-logo">MAYAMI<br><span>DRIFT</span></div>
  <div id="coinRow"><span class="coin-ico"></span><span id="coinAmt">0</span></div>
  <div class="mm-nav">
    <button class="mm-btn" id="playBtn">PLAY</button>
    <button class="mm-btn sec" id="garageBtn">🚗 GARAGE</button>
    <button class="mm-btn sec" id="leaderBtn">🏆 LEADERBOARD</button>
  </div>
</div>

<div id="garageScreen" class="screen hidden">
  <h2 style="color:#fff;margin-bottom:10px;">SELECT YOUR CAR</h2>
  <div class="car-grid" id="carGrid"></div>
  <button class="mm-btn sec" id="garageBackBtn" style="width:150px;margin-top:12px;">← BACK</button>
</div>

<div id="leaderScreen" class="screen hidden">
  <h2 style="color:#fff;margin-bottom:10px;">🏆 LEADERBOARD</h2>
  <div id="playerName" style="color:var(--acc);font-size:14px;margin-bottom:8px;">---</div>
  <div id="leaderList"></div>
  <button class="mm-btn sec" id="leaderBackBtn" style="width:150px;margin-top:8px;">← BACK</button>
</div>

<div id="gameOverScreen" class="screen hidden">
  <h2 style="color:var(--red);font-size:36px;margin-bottom:16px;">GAME OVER</h2>
  <div style="display:flex;gap:20px;margin-bottom:16px;">
    <div style="text-align:center;"><div style="font-size:28px;color:#fff;font-weight:bold;" id="goScore">0</div><div style="font-size:10px;color:var(--dim);">SCORE</div></div>
    <div style="text-align:center;"><div style="font-size:28px;color:#fff;font-weight:bold;" id="goBest">0</div><div style="font-size:10px;color:var(--dim);">BEST</div></div>
  </div>
  <div style="color:var(--acc);margin-bottom:16px;font-size:12px;" id="coinsMsg">+0 🪙</div>
  <div class="mm-nav" style="max-width:200px;">
    <button class="mm-btn" id="retryBtn">RETRY</button>
    <button class="mm-btn sec" id="menuBtn">MENU</button>
  </div>
</div>

<div id="pauseScreen" class="screen hidden">
  <h2 style="color:#fff;font-size:32px;margin-bottom:20px;">PAUSE</h2>
  <div class="mm-nav" style="max-width:200px;">
    <button class="mm-btn" id="resumeBtn">RESUME</button>
    <button class="mm-btn sec" id="pauseMenuBtn">MENU</button>
  </div>
</div>
</div>

<script>
(function(){"use strict";

var TG = window.Telegram?.WebApp;
var TG_USER = null;
if(TG){
  TG.ready?.();
  TG.expand?.();
  TG.disableVerticalSwipes?.();
  TG_USER = TG.initDataUnsafe?.user;
}

var S = {
  get:(k,d) => {try{var v=localStorage.getItem("md_"+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set:(k,v) => {try{localStorage.setItem("md_"+k,JSON.stringify(v));}catch(e){}}
};

var bestScore = S.get("best", 0);
var totalCoins = S.get("coins", 0);
var selectedCar = S.get("selected", "city");
var playerName = S.get("playerName", "");

if(!playerName && TG_USER){
  playerName = (TG_USER.first_name || "RACER").toUpperCase().slice(0,12);
  S.set("playerName", playerName);
}

var CARS = [
  {id:"city",name:"City",body:"#1e3f7a",acc:"#4cc9f0"},
  {id:"street",name:"Street",body:"#6b1c1c",acc:"#ff5555"},
  {id:"muscle",name:"Muscle",body:"#1a3d1a",acc:"#57cc99"},
  {id:"turbo",name:"Turbo",body:"#001e3c",acc:"#00d4ff"},
  {id:"viper",name:"Viper",body:"#2e0a2e",acc:"#e040fb"},
  {id:"ghost",name:"Ghost",body:"#08050f",acc:"#7c3aed"},
  {id:"stealth",name:"Stealth",body:"#050505",acc:"#39ff14"},
  {id:"phantom",name:"Phantom",body:"#080010",acc:"#ff00ff"},
  {id:"golden",name:"Golden",body:"#120b00",acc:"#ffd700"}
];

var BOARD = [];
function loadBoard(){
  BOARD = S.get("board", []);
  return BOARD;
}

function saveToBoard(name, score, tgId){
  if(!name || score <= 0) return;
  loadBoard();
  var found = BOARD.find(e => e.tgId === tgId || e.name === name);
  if(found && score > found.score){
    found.score = score;
    found.name = name;
  } else if(!found){
    BOARD.push({name, score, tgId, ts: Date.now()});
  }
  BOARD.sort((a,b) => b.score - a.score);
  BOARD = BOARD.slice(0, 50);
  S.set("board", BOARD);
}

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = window.innerWidth;
var H = window.innerHeight;

function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  if(game) game.resize(W, H);
}
window.addEventListener("resize", resize, {passive:true});

function drawCar(g, def, pw, ph){
  var B = def.body, A = def.acc;
  g.clearRect(0,0,pw,ph);
  g.fillStyle = B;
  g.beginPath();
  g.moveTo(pw*0.1, ph*0.9);
  g.lineTo(pw*0.05, ph*0.6);
  g.lineTo(pw*0.05, ph*0.3);
  g.lineTo(pw*0.5, ph*0.2);
  g.lineTo(pw*0.95, ph*0.3);
  g.lineTo(pw*0.95, ph*0.6);
  g.lineTo(pw*0.9, ph*0.9);
  g.closePath();
  g.fill();
  g.fillStyle = A;
  g.beginPath();
  g.arc(pw*0.25, ph*0.8, pw*0.08, 0, Math.PI*2);
  g.arc(pw*0.75, ph*0.8, pw*0.08, 0, Math.PI*2);
  g.fill();
}

function renderCar(def){
  var c = document.createElement("canvas");
  c.width = 32;
  c.height = 50;
  drawCar(c.getContext("2d"), def, 32, 50);
  return c;
}

function Game(w, h){
  this.w = w;
  this.h = h;
  this.carId = selectedCar;
  this.lane = 1;
  this.px = w/2;
  this.py = h*0.7;
  this.enemies = [];
  this.coins = [];
  this.score = 0;
  this.lives = 3;
  this.frame = 0;
  this.dead = false;
  this.roadY = 0;
}

Game.prototype.resize = function(w, h){
  this.w = w;
  this.h = h;
};

Game.prototype.moveLeft = function(){
  if(this.lane > 0) this.lane--;
  this.px = this.w * (0.2 + this.lane * 0.3);
};

Game.prototype.moveRight = function(){
  if(this.lane < 2) this.lane++;
  this.px = this.w * (0.2 + this.lane * 0.3);
};

Game.prototype.update = function(){
  if(this.dead) return;
  this.frame++;
  this.roadY = (this.roadY + 4) % (this.h * 0.1);
  this.score += 1;
  
  if(Math.random() < 0.01 && this.enemies.length < 3){
    var ln = Math.floor(Math.random()*3);
    this.enemies.push({x: this.w*(0.2+ln*0.3), y: -40, ln: ln});
  }
  
  for(var i=this.enemies.length-1; i>=0; i--){
    var e = this.enemies[i];
    e.y += 6;
    if(e.y > this.h) this.enemies.splice(i,1);
    if(Math.abs(e.x - this.px) < 30 && Math.abs(e.y - this.py) < 40){
      this.lives--;
      if(this.lives <= 0) this.dead = true;
    }
  }
  
  if(Math.random() < 0.008 && this.coins.length < 2){
    this.coins.push({x: this.w*(0.2+Math.floor(Math.random()*3)*0.3), y: -20});
  }
  
  for(var i=this.coins.length-1; i>=0; i--){
    var c = this.coins[i];
    c.y += 5;
    if(c.y > this.h) this.coins.splice(i,1);
    if(Math.abs(c.x - this.px) < 20 && Math.abs(c.y - this.py) < 30){
      totalCoins += 10;
      S.set("coins", totalCoins);
      this.coins.splice(i,1);
    }
  }
};

Game.prototype.draw = function(){
  ctx.fillStyle = "#07080c";
  ctx.fillRect(0,0,this.w,this.h);
  
  ctx.strokeStyle = "#ffd700";
  ctx.lineWidth = 2;
  for(var i=-1; i<this.h/60; i++){
    ctx.beginPath();
    ctx.moveTo(this.w/2-2, i*60+this.roadY);
    ctx.lineTo(this.w/2-2, i*60+30+this.roadY);
    ctx.stroke();
  }
  
  for(var i=0; i<this.enemies.length; i++){
    var e = this.enemies[i];
    ctx.fillStyle = "#e63946";
    ctx.fillRect(e.x-20, e.y-20, 40, 40);
  }
  
  for(var i=0; i<this.coins.length; i++){
    var c = this.coins[i];
    ctx.fillStyle = "#ffd700";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 10, 0, Math.PI*2);
    ctx.fill();
  }
  
  var def = CARS.find(x => x.id === this.carId);
  if(def){
    ctx.fillStyle = def.body;
    ctx.fillRect(this.px-15, this.py-25, 30, 50);
    ctx.fillStyle = def.acc;
    ctx.fillRect(this.px-12, this.py-20, 24, 10);
  }
  
  document.getElementById("scoreLbl").textContent = this.score;
};

var game = null;
var running = false;
var paused = false;
var animId = null;

function showScreen(id){
  ["mainMenu","garageScreen","leaderScreen","gameOverScreen","pauseScreen"].forEach(s => {
    document.getElementById(s).classList.toggle("hidden", s !== id);
  });
}

function updateUI(){
  document.getElementById("coinAmt").textContent = totalCoins;
  document.getElementById("bestLbl").textContent = "BEST: " + bestScore;
}

function startGame(){
  showScreen(null);
  game = new Game(W, H);
  running = true;
  paused = false;
  document.getElementById("pauseBtn").style.display = "block";
  
  function loop(){
    if(!running) return;
    if(!paused){
      game.update();
      game.draw();
      if(game.dead){
        endGame();
        return;
      }
    }
    animId = requestAnimationFrame(loop);
  }
  loop();
}

function endGame(){
  running = false;
  var myTgId = TG_USER ? String(TG_USER.id) : null;
  saveToBoard(playerName, game.score, myTgId);
  if(game.score > bestScore){
    bestScore = game.score;
    S.set("best", bestScore);
  }
  document.getElementById("goScore").textContent = game.score;
  document.getElementById("goBest").textContent = bestScore;
  showScreen("gameOverScreen");
}

document.getElementById("playBtn").onclick = startGame;
document.getElementById("pauseBtn").onclick = () => {
  paused = !paused;
  if(paused) showScreen("pauseScreen");
  else showScreen(null);
};
document.getElementById("resumeBtn").onclick = () => {
  paused = false;
  showScreen(null);
};
document.getElementById("retryBtn").onclick = startGame;
document.getElementById("garageBtn").onclick = () => {
  var grid = document.getElementById("carGrid");
  grid.innerHTML = "";
  CARS.forEach(def => {
    var cell = document.createElement("div");
    cell.className = "car-cell" + (def.id === selectedCar ? " selected" : "");
    var cv = renderCar(def);
    cell.appendChild(cv);
    var nm = document.createElement("div");
    nm.className = "car-name";
    nm.textContent = def.name;
    cell.appendChild(nm);
    cell.onclick = () => {
      selectedCar = def.id;
      S.set("selected", def.id);
      document.querySelectorAll(".car-cell").forEach(x => x.classList.remove("selected"));
      cell.classList.add("selected");
    };
    grid.appendChild(cell);
  });
  showScreen("garageScreen");
};
document.getElementById("garageBackBtn").onclick = () => showScreen("mainMenu");
document.getElementById("leaderBtn").onclick = () => {
  loadBoard();
  document.getElementById("playerName").textContent = playerName;
  var list = document.getElementById("leaderList");
  list.innerHTML = "";
  BOARD.slice(0,20).forEach((e,i) => {
    var row = document.createElement("div");
    row.className = "lrow" + (e.name === playerName ? " me" : "");
    row.innerHTML = `<div class="lrank">${i+1}</div><div class="lname">${e.name}</div><div class="lscore">${e.score}</div>`;
    list.appendChild(row);
  });
  showScreen("leaderScreen");
};
document.getElementById("leaderBackBtn").onclick = () => showScreen("mainMenu");
document.getElementById("menuBtn").onclick = () => showScreen("mainMenu");
document.getElementById("pauseMenuBtn").onclick = () => {running=false;showScreen("mainMenu");};

var leftPressed = false, rightPressed = false;
document.getElementById("ctrlL").onmousedown = () => { leftPressed = true; };
document.getElementById("ctrlL").onmouseup = () => { leftPressed = false; };
document.getElementById("ctrlR").onmousedown = () => { rightPressed = true; };
document.getElementById("ctrlR").onmouseup = () => { rightPressed = false; };

document.addEventListener("touchstart", e => {
  var touch = e.touches[0];
  if(touch.clientX < W/3) leftPressed = true;
  else if(touch.clientX > W*2/3) rightPressed = true;
}, {passive:true});

document.addEventListener("touchend", () => {
  leftPressed = false;
  rightPressed = false;
}, {passive:true});

setInterval(() => {
  if(running && !paused && game){
    if(leftPressed) game.moveLeft();
    if(rightPressed) game.moveRight();
  }
}, 50);

resize();
updateUI();
showScreen("mainMenu");

})();
</script>
</body>
</html>
