<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        input { width: 80%; padding: 15px; border-radius: 20px; border: none; margin-bottom: 10px; }
        button { padding: 15px 30px; border-radius: 20px; border: none; background: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <input type="text" id="userInput" placeholder="Пиши Боссу...">
    <button onclick="send()">ОТПРАВИТЬ</button>
    <script>
        function send() {
            window.Telegram.WebApp.sendData(JSON.stringify({text: document.getElementById('userInput').value}));
        }
    </script>
</body>
</html>
