<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAYAMI DRIFT</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>body { margin: 0; background: #2ecc71; overflow: hidden; }</style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        scene: {
            preload: function() {
                this.load.image('car', 'car.png');
                this.load.audio('music', 'music.mp3');
            },
            create: function() {
                const {width, height} = this.game.config;
                this.score = 0;
                
                // Дорога (сетка)
                this.add.rectangle(width/2, height/2, 250, height * 2, 0x333333);
                
                // Машина
                this.car = this.add.sprite(width/2, height * 0.7, 'car').setScale(0.25);
                
                // Точка привязки
                this.pivot = this.add.circle(0, 0, 15, 0xf1c40f);
                this.line = this.add.graphics();
                
                this.scoreText = this.add.text(width - 100, 20, '0', { fontSize: '32px', fill: '#fff' });

                this.spawnPivot();
                
                this.input.on('pointerdown', () => this.isDrifting = true);
                this.input.on('pointerup', () => this.isDrifting = false);
                
                this.sound.add('music', { loop: true, volume: 0.5 }).play();
            },
            spawnPivot: function() {
                const side = Math.random() > 0.5 ? 1 : -1;
                this.pivot.setPosition(this.game.config.width/2 + (side * 100), this.game.config.height * 0.2);
            },
            update: function() {
                if (this.isDrifting) {
                    Phaser.Math.RotateAround(this.car, this.pivot.x, this.pivot.y, 0.08);
                    this.car.angle += 5;
                    
                    this.line.clear().lineStyle(4, 0xf1c40f).lineBetween(this.car.x, this.car.y, this.pivot.x, this.pivot.y);
                } else {
                    this.line.clear();
                    this.car.y -= 5;
                    if (this.car.y < 0) {
                        this.car.y = this.game.config.height;
                        this.score++;
                        this.scoreText.setText(this.score);
                        this.spawnPivot();
                    }
                }
            }
        }
    };
    new Phaser.Game(config);
</script>
</body>
</html>
