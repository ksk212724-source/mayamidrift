<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MayamiDrift</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Courier New',monospace}
#gameWrapper{position:relative;width:100vw;height:100vh;max-width:480px;margin:0 auto}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:absolute;top:0;left:0;right:0;padding:14px 18px;pointer-events:none;z-index:10}
#scoreDisplay{color:#fff;font-size:clamp(18px,5vw,26px);font-weight:bold;letter-spacing:2px;text-shadow:0 0 10px #0ff,0 0 20px #0ff}
#livesDisplay{position:absolute;top:14px;right:18px;display:flex;gap:6px}
.heart{font-size:clamp(16px,4.5vw,24px);filter:drop-shadow(0 0 6px #f0f)}
#pauseBtn{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:transparent;border:1.5px solid rgba(0,255,255,0.5);color:#0ff;font-size:clamp(12px,3vw,15px);font-family:'Courier New',monospace;letter-spacing:2px;padding:5px 14px;cursor:pointer;pointer-events:all;z-index:11;text-shadow:0 0 8px #0ff;border-radius:4px;display:none;-webkit-tap-highlight-color:transparent}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,10,0.88);z-index:20;gap:18px}
#overlay.hidden{display:none}
#overlayTitle{font-size:clamp(28px,8vw,52px);font-weight:900;letter-spacing:4px;text-transform:uppercase;color:#0ff;text-shadow:0 0 20px #0ff,0 0 50px #0ff;text-align:center;line-height:1.2}
#overlaySubtitle{font-size:clamp(11px,3vw,15px);color:#888;letter-spacing:3px;text-transform:uppercase;text-align:center}
#overlayScore{font-size:clamp(18px,5vw,24px);color:#f0f;text-shadow:0 0 12px #f0f;letter-spacing:2px}
#bestScore{font-size:clamp(12px,3.5vw,16px);color:#777;letter-spacing:1px}
#overlayBtn{margin-top:8px;padding:15px 48px;background:transparent;border:2px solid #0ff;color:#0ff;font-size:clamp(16px,4.5vw,21px);font-family:'Courier New',monospace;letter-spacing:4px;cursor:pointer;text-transform:uppercase;box-shadow:0 0 25px #0ff,inset 0 0 25px rgba(0,255,255,0.08);transition:all 0.15s;-webkit-tap-highlight-color:transparent;border-radius:3px}
#overlayBtn:active{background:rgba(0,255,255,0.18);transform:scale(0.96)}
#controls{position:absolute;bottom:0;left:0;right:0;height:100%;display:flex;pointer-events:none;z-index:5}
#ctrlLeft,#ctrlRight{flex:1;height:100%;pointer-events:all;-webkit-tap-highlight-color:transparent}
#pauseOverlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,15,0.82);z-index:19;gap:20px}
#pauseOverlay.hidden{display:none}
#pauseTitle{font-size:clamp(26px,8vw,44px);color:#0ff;letter-spacing:5px;text-shadow:0 0 20px #0ff;font-weight:900}
.pmBtn{padding:12px 36px;background:transparent;border:2px solid #f0f;color:#f0f;font-size:clamp(14px,3.5vw,18px);font-family:'Courier New',monospace;letter-spacing:3px;cursor:pointer;text-transform:uppercase;box-shadow:0 0 15px #f0f;-webkit-tap-highlight-color:transparent;border-radius:3px;transition:all 0.15s}
.pmBtn:active{transform:scale(0.97)}
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="scoreDisplay">SCORE: 0</div>
    <div id="livesDisplay">
      <span class="heart">&#10084;</span>
      <span class="heart">&#10084;</span>
      <span class="heart">&#10084;</span>
    </div>
  </div>
  <button id="pauseBtn">|| PAUSE</button>
  <div id="controls"><div id="ctrlLeft"></div><div id="ctrlRight"></div></div>
  <div id="overlay">
    <div id="overlayTitle">MAYAMI<br>DRIFT</div>
    <div id="overlaySubtitle">избегай встречных машин</div>
    <div id="overlayScore" style="display:none"></div>
    <div id="bestScore"></div>
    <button id="overlayBtn">СТАРТ</button>
  </div>
  <div id="pauseOverlay" class="hidden">
    <div id="pauseTitle">ПАУЗА</div>
    <button class="pmBtn" id="resumeBtn">&#9654; ПРОДОЛЖИТЬ</button>
    <button class="pmBtn" id="restartBtn" style="border-color:#0ff;color:#0ff;box-shadow:0 0 15px #0ff">&#8635; ЗАНОВО</button>
  </div>
</div>
<script>
(function(){
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var wrapper=document.getElementById('gameWrapper');

if(window.Telegram&&window.Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}

var assets={player:null,enemy:null,road:null};

function loadAssets(cb){
  var n=0,total=3;
  function done(){n++;if(n>=total)cb();}
  function tryLoad(key,src){
    var img=new Image();
    img.onload=function(){assets[key]=img;done();};
    img.onerror=function(){assets[key]=null;done();};
    img.src=src;
  }
  tryLoad('player','player.png');
  tryLoad('enemy','enemy.png');
  tryLoad('road','road.png');
}

var music=null;
function initMusic(){
  if(!music){music=new Audio('music.mp3');music.loop=true;music.volume=0.38;}
  music.play().catch(function(){});
}
function pauseMusic(){if(music)music.pause();}
function resumeMusic(){if(music)music.play().catch(function(){});}
function stopMusic(){if(music){music.pause();music.currentTime=0;}}

var W,H,DPR;
function resize(){
  DPR=window.devicePixelRatio||1;
  W=wrapper.clientWidth;H=wrapper.clientHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(game)game.resize(W,H);
}
window.addEventListener('resize',resize);
resize();

function Game(w,h){
  this.w=w;this.h=h;this.laneCount=3;this._init();
}
Game.prototype._init=function(){
  var w=this.w,h=this.h;
  this.roadLeft=w*0.08;this.roadRight=w*0.92;
  this.roadW=this.roadRight-this.roadLeft;
  this.laneW=this.roadW/this.laneCount;
  this.playerW=this.laneW*0.62;this.playerH=this.playerW*1.85;
  this.playerLane=1;
  this.playerX=this._lc(1)-this.playerW/2;
  this.playerTargetX=this.playerX;
  this.playerY=h*0.68;
  this.playerAngle=0;this.playerAngleTarget=0;
  this.roadY=0;this.pillarsY=0;
  this.enemies=[];this.enemyTimer=0;
  this.score=0;this.lives=3;this.scoreTimer=0;
  this.dead=false;this.invincible=0;this.flash=0;
  this.speedMult=1;this.frame=0;
};
Game.prototype.resize=function(w,h){
  this.w=w;this.h=h;
  this.roadLeft=w*0.08;this.roadRight=w*0.92;
  this.roadW=this.roadRight-this.roadLeft;
  this.laneW=this.roadW/this.laneCount;
  this.playerW=this.laneW*0.62;this.playerH=this.playerW*1.85;
  this.playerTargetX=this._lc(this.playerLane)-this.playerW/2;
};
Game.prototype._lc=function(i){return this.roadLeft+i*this.laneW+this.laneW/2;};
Game.prototype.moveLeft=function(){
  if(this.playerLane>0){this.playerLane--;this.playerTargetX=this._lc(this.playerLane)-this.playerW/2;this.playerAngleTarget=-0.55;}
};
Game.prototype.moveRight=function(){
  if(this.playerLane<this.laneCount-1){this.playerLane++;this.playerTargetX=this._lc(this.playerLane)-this.playerW/2;this.playerAngleTarget=0.55;}
};
Game.prototype.update=function(){
  if(this.dead)return;
  this.frame++;
  this.speedMult=1+this.frame/2200;
  var spd=this.h*0.009*this.speedMult;
  this.roadY=(this.roadY+spd*2.2)%(this.h*0.13);
  this.pillarsY=(this.pillarsY+spd*2.2)%90;
  this.playerX+=(this.playerTargetX-this.playerX)*0.15;
  if(Math.abs(this.playerX-this.playerTargetX)<this.playerW*0.3)this.playerAngleTarget=0;
  this.playerAngle+=(this.playerAngleTarget-this.playerAngle)*0.14;
  if(++this.scoreTimer>=6){this.score+=10;this.scoreTimer=0;}
  this.enemyTimer++;
  var interval=Math.max(45,115/this.speedMult);
  if(this.enemyTimer>=interval){this._spawnEnemy();this.enemyTimer=0;}
  for(var i=0;i<this.enemies.length;i++)this.enemies[i].y+=this.enemies[i].speed;
  this.enemies=this.enemies.filter(function(e){return e.y<this.h+e.h;}.bind(this));
  if(this.invincible>0){this.invincible--;}else{
    for(var j=0;j<this.enemies.length;j++){
      var e=this.enemies[j];
      if(this._overlap(this.playerX+this.playerW*0.12,this.playerY+this.playerH*0.08,this.playerW*0.76,this.playerH*0.84,
        e.x+e.w*0.1,e.y+e.h*0.1,e.w*0.8,e.h*0.8)){
        this.lives--;this.flash=22;this.invincible=95;
        if(this.lives<=0){this.dead=true;stopMusic();}
        break;
      }
    }
  }
  if(this.flash>0)this.flash--;
};
Game.prototype._spawnEnemy=function(){
  var lane=Math.floor(Math.random()*this.laneCount);
  var ew=this.laneW*0.65,eh=ew*1.7;
  this.enemies.push({lane:lane,x:this._lc(lane)-ew/2,y:-eh,w:ew,h:eh,speed:this.h*0.009*this.speedMult+this.h*0.003});
};
Game.prototype._overlap=function(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
};
Game.prototype.draw=function(){
  var w=this.w,h=this.h;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#05050f';ctx.fillRect(0,0,w,h);
  this._drawRoad();this._drawPillars();this._drawDashes();
  for(var i=0;i<this.enemies.length;i++)this._drawEnemy(this.enemies[i]);
  if(this.invincible===0||Math.floor(this.invincible/5)%2===0)this._drawPlayer();
  if(this.flash>0){ctx.fillStyle='rgba(255,0,70,'+this.flash/35+')';ctx.fillRect(0,0,w,h);}
};
Game.prototype._drawRoad=function(){
  var h=this.h;
  ctx.save();ctx.beginPath();ctx.rect(this.roadLeft,0,this.roadW,h);ctx.clip();
  var a=assets.road;
  if(a&&a.complete&&a.naturalWidth>0){
    var scale=this.roadW/a.naturalWidth;
    var sh=a.naturalHeight*scale;if(sh<1)sh=h;
    var offset=this.roadY%sh;
    for(var y=-sh+offset;y<h+sh;y+=sh)ctx.drawImage(a,this.roadLeft,y,this.roadW,sh);
  }else{
    var g=ctx.createLinearGradient(this.roadLeft,0,this.roadRight,0);
    g.addColorStop(0,'#0a0a1a');g.addColorStop(.5,'#111126');g.addColorStop(1,'#0a0a1a');
    ctx.fillStyle=g;ctx.fillRect(this.roadLeft,0,this.roadW,h);
  }
  ctx.restore();
};
Game.prototype._drawDashes=function(){
  var h=this.h;ctx.save();
  ctx.strokeStyle='rgba(0,230,255,0.75)';ctx.lineWidth=3;
  ctx.setLineDash([h*0.065,h*0.055]);ctx.lineDashOffset=-this.roadY;
  for(var i=1;i<this.laneCount;i++){
    var x=this.roadLeft+i*this.laneW;
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();
  }
  ctx.setLineDash([]);ctx.restore();
};
Game.prototype._drawPillars=function(){
  var w=this.w,h=this.h,self=this;
  var pw=Math.max(w*0.075,22),seg=90;
  var palette=[['#ff00ff','#cc00cc'],['#0066ff','#0033cc'],['#ff00ff','#cc00cc']];
  ctx.save();
  function drawSide(left){
    for(var y=-seg+self.pillarsY;y<h+seg;y+=seg){
      var ci=((Math.floor(y/seg)%3)+3)%3;
      var c1=palette[ci][0],c2=palette[ci][1];
      var grd=left?ctx.createLinearGradient(0,0,pw,0):ctx.createLinearGradient(w-pw,0,w,0);
      grd.addColorStop(0,left?c1:c2);grd.addColorStop(1,left?c2:c1);
      ctx.fillStyle=grd;ctx.shadowColor=c1;ctx.shadowBlur=22;
      ctx.fillRect(left?0:w-pw,y,pw,seg-5);
    }
  }
  drawSide(true);drawSide(false);ctx.shadowBlur=0;ctx.restore();
};
Game.prototype._drawPlayer=function(){
  var x=this.playerX,y=this.playerY,pw=this.playerW,ph=this.playerH,ang=this.playerAngle;
  var cx=x+pw/2,cy=y+ph/2;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);
  ctx.shadowColor='#00ffff';ctx.shadowBlur=28;
  var a=assets.player;
  if(a&&a.complete&&a.naturalWidth>0){ctx.drawImage(a,-pw/2,-ph/2,pw,ph);}
  else{this._drawPlayerFallback(-pw/2,-ph/2,pw,ph);}
  ctx.restore();
  ctx.save();
  var gy=y+ph*0.05;
  var grd=ctx.createRadialGradient(cx,gy,2,cx,gy-ph*0.35,ph*0.55);
  grd.addColorStop(0,'rgba(180,255,255,0.45)');grd.addColorStop(1,'rgba(0,200,255,0)');
  ctx.fillStyle=grd;ctx.beginPath();ctx.ellipse(cx,gy,pw*0.45,ph*0.45,0,Math.PI,2*Math.PI);ctx.fill();
  ctx.restore();
};
Game.prototype._drawPlayerFallback=function(x,y,pw,ph){
  var g=ctx.createRadialGradient(x+pw/2,y+ph/2,pw*0.1,x+pw/2,y+ph/2,pw*0.6);
  g.addColorStop(0,'#40ffff');g.addColorStop(1,'#006688');
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,pw,ph,pw*0.18);ctx.fill();
  ctx.strokeStyle='#00ffff';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x,y,pw,ph,pw*0.18);ctx.stroke();
  ctx.fillStyle='rgba(0,200,220,0.5)';ctx.fillRect(x+pw*0.18,y+ph*0.12,pw*0.64,ph*0.28);
  ctx.fillStyle='#fff';ctx.shadowColor='#aaffff';ctx.shadowBlur=10;
  ctx.fillRect(x+pw*0.12,y+ph*0.04,pw*0.28,ph*0.06);
  ctx.fillRect(x+pw*0.60,y+ph*0.04,pw*0.28,ph*0.06);
  ctx.fillStyle='#ff2222';ctx.shadowColor='#ff0000';
  ctx.fillRect(x+pw*0.1,y+ph*0.88,pw*0.28,ph*0.06);
  ctx.fillRect(x+pw*0.62,y+ph*0.88,pw*0.28,ph*0.06);
};
Game.prototype._drawEnemy=function(e){
  ctx.save();ctx.shadowColor='#ff6600';ctx.shadowBlur=22;
  var a=assets.enemy;
  if(a&&a.complete&&a.naturalWidth>0){ctx.drawImage(a,e.x,e.y,e.w,e.h);}
  else{this._drawEnemyFallback(e);}
  ctx.restore();
};
Game.prototype._drawEnemyFallback=function(e){
  var x=e.x,y=e.y,w=e.w,h=e.h;
  var g=ctx.createLinearGradient(x,y,x+w,y);
  g.addColorStop(0,'#3a3a55');g.addColorStop(.5,'#555570');g.addColorStop(1,'#3a3a55');
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,w,h,w*0.12);ctx.fill();
  ctx.strokeStyle='#ff6600';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(x,y,w,h,w*0.12);ctx.stroke();
  ctx.fillStyle='#444460';ctx.fillRect(x+w*0.12,y+h*0.05,w*0.76,h*0.32);
  ctx.fillStyle='rgba(80,100,180,0.55)';ctx.fillRect(x+w*0.18,y+h*0.07,w*0.64,h*0.22);
  ctx.fillStyle='#ffaa00';ctx.shadowColor='#ffaa00';ctx.shadowBlur=14;
  ctx.fillRect(x+w*0.10,y+h*0.85,w*0.28,h*0.09);
  ctx.fillRect(x+w*0.62,y+h*0.85,w*0.28,h*0.09);
  ctx.fillStyle='#ff00cc';ctx.shadowColor='#ff00cc';
  ctx.fillRect(x+w*0.16,y+h*0.02,w*0.22,h*0.06);
  ctx.fillRect(x+w*0.62,y+h*0.02,w*0.22,h*0.06);
};

var game=null,running=false,paused=false,animId=null;
var bestScore=0;
try{bestScore=parseInt(localStorage.getItem('mayamidrift_best'))||0;}catch(e){}

var overlay=document.getElementById('overlay');
var overlayTitle=document.getElementById('overlayTitle');
var overlayScore=document.getElementById('overlayScore');
var overlayBtn=document.getElementById('overlayBtn');
var bestScoreEl=document.getElementById('bestScore');
var scoreDisp=document.getElementById('scoreDisplay');
var livesDisp=document.getElementById('livesDisplay');
var pauseBtn=document.getElementById('pauseBtn');
var pauseOverlay=document.getElementById('pauseOverlay');
var resumeBtn=document.getElementById('resumeBtn');
var restartBtn=document.getElementById('restartBtn');

function updateLives(n){
  livesDisp.innerHTML='';
  for(var i=0;i<Math.max(0,n);i++)livesDisp.innerHTML+='<span class="heart">&#10084;</span>';
}
function startGame(){
  overlay.classList.add('hidden');pauseOverlay.classList.add('hidden');
  if(animId)cancelAnimationFrame(animId);
  game=new Game(W,H);running=true;paused=false;
  pauseBtn.style.display='block';pauseBtn.textContent='|| PAUSE';
  initMusic();loop();
}
function loop(){
  if(!running||paused)return;
  game.resize(W,H);game.update();game.draw();
  scoreDisp.textContent='SCORE: '+game.score;
  updateLives(game.lives);
  if(game.dead){
    running=false;pauseBtn.style.display='none';
    if(game.score>bestScore){bestScore=game.score;try{localStorage.setItem('mayamidrift_best',bestScore);}catch(e){}}
    showGameOver();return;
  }
  animId=requestAnimationFrame(loop);
}
function showGameOver(){
  overlayTitle.textContent='GAME OVER';
  overlayScore.style.display='block';
  overlayScore.textContent='СЧЁТ: '+(game?game.score:0);
  bestScoreEl.textContent='РЕКОРД: '+bestScore;
  overlayBtn.textContent='ЗАНОВО';
  overlay.classList.remove('hidden');
}
function togglePause(){
  if(!running||!game||game.dead)return;
  paused=!paused;
  if(paused){pauseMusic();pauseOverlay.classList.remove('hidden');pauseBtn.textContent='> PLAY';}
  else{resumeMusic();pauseOverlay.classList.add('hidden');pauseBtn.textContent='|| PAUSE';loop();}
}

pauseBtn.addEventListener('click',togglePause);
resumeBtn.addEventListener('click',togglePause);
restartBtn.addEventListener('click',startGame);
overlayBtn.addEventListener('click',startGame);

var touchStartX=null,touchStartY=null;
canvas.addEventListener('touchstart',function(e){
  if(!running||!game||paused)return;
  touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;
},{passive:true});
canvas.addEventListener('touchend',function(e){
  if(!running||!game||paused||touchStartX===null)return;
  var dx=e.changedTouches[0].clientX-touchStartX;
  var dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>18){if(dx<0)game.moveLeft();else game.moveRight();}
  touchStartX=null;
},{passive:true});
document.getElementById('ctrlLeft').addEventListener('click',function(){if(game&&running&&!paused)game.moveLeft();});
document.getElementById('ctrlRight').addEventListener('click',function(){if(game&&running&&!paused)game.moveRight();});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='a'){if(game&&running&&!paused)game.moveLeft();}
  else if(e.key==='ArrowRight'||e.key==='d'){if(game&&running&&!paused)game.moveRight();}
  else if(e.key===' '||e.key==='Escape')togglePause();
});

bestScoreEl.textContent=bestScore?'РЕКОРД: '+bestScore:'';
overlayScore.style.display='none';
loadAssets(function(){ctx.fillStyle='#05050f';ctx.fillRect(0,0,W,H);});
})();
</script>
</body>
</html>
